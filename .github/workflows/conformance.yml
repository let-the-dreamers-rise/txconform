name: conformance
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: catch SDK releases that regress
jobs:
  oracle-and-harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: Build oracle (Agave crates)
        run: cargo build --release --manifest-path oracle/Cargo.toml
      - name: Generate + judge vectors
        run: |
          mkdir -p vectors results
          ./oracle/target/release/txconform-oracle gen --out vectors/vectors.jsonl --random 200 --mutations 1000
          ./oracle/target/release/txconform-oracle judge --vectors vectors/vectors.jsonl --out vectors/oracle.jsonl
      - name: TypeScript harnesses (kit, web3.js 3.x, web3.js 1.x)
        working-directory: harness/ts
        run: |
          npm ci
          node harness_kit.js ../../vectors/vectors.jsonl ../../results/kit.jsonl
          node harness_web3.js ../../vectors/vectors.jsonl ../../results/web3js3.jsonl
          node harness_web3.js ../../vectors/vectors.jsonl ../../results/web3js1.jsonl web3js1
      - name: Python harness (solders)
        run: |
          pip install -r harness/py/requirements.txt
          python harness/py/harness_solders.py vectors/vectors.jsonl results/solders.jsonl
      - name: Go harness (solana-go v2)
        working-directory: harness/go
        run: |
          go build -o harness-go .
          ./harness-go ../../vectors/vectors.jsonl ../../results/solana-go.jsonl
      - name: Go harness (gagliardetto/solana-go)
        working-directory: harness/go-gagliardetto
        run: |
          go build -o harness-go-gagliardetto .
          ./harness-go-gagliardetto ../../vectors/vectors.jsonl ../../results/gagliardetto.jsonl
      - name: Rust harness (solana-primitives)
        working-directory: harness/rust-primitives
        run: |
          cargo build --release
          ./target/release/txconform-harness-primitives ../../vectors/vectors.jsonl ../../results/primitives.jsonl
      - name: Report
        run: |
          python3 tools/rust_sdk_results.py vectors/oracle.jsonl results/rust-sdk.jsonl oracle/Cargo.lock
          python3 txconform.py --results results/rust-sdk.jsonl results/kit.jsonl results/web3js3.jsonl results/web3js1.jsonl results/solders.jsonl results/solana-go.jsonl results/gagliardetto.jsonl results/primitives.jsonl
          python3 tools/paykit_export.py vectors/vectors.jsonl vectors/oracle.jsonl vectors/paykit-wire-vectors.json
      - uses: actions/upload-artifact@v4
        with:
          name: txconform-results
          path: |
            vectors/
            results/
      - name: Gate on known-good baseline
        run: python3 tools/check_baseline.py results/details.json baseline.json

  rpc-path:
    # What a real node's JSON-RPC says about every vector (simulateTransaction on
    # solana-test-validator from the latest Agave release). Reported, not yet gated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build oracle and generate vectors
        run: |
          cargo build --release --manifest-path oracle/Cargo.toml
          mkdir -p vectors results
          ./oracle/target/release/txconform-oracle gen --out vectors/vectors.jsonl --random 200 --mutations 1000
          ./oracle/target/release/txconform-oracle judge --vectors vectors/vectors.jsonl --out vectors/oracle.jsonl
      - name: Download Agave release (solana-test-validator)
        run: |
          curl -sSL -o agave.tar.bz2 https://github.com/anza-xyz/agave/releases/latest/download/solana-release-x86_64-unknown-linux-gnu.tar.bz2
          tar -xjf agave.tar.bz2
          ./solana-release/bin/solana-test-validator --version
      - name: Start validator
        run: |
          nohup ./solana-release/bin/solana-test-validator --quiet --reset --ledger /tmp/ledger > validator.log 2>&1 &
          sleep 5
      - name: Run RPC harness
        run: python3 harness/rpc/rpc_harness.py vectors/vectors.jsonl results/rpc.jsonl http://127.0.0.1:8899
      - name: Report (RPC vs oracle)
        run: python3 txconform.py --results results/rpc.jsonl --report results/REPORT-rpc.md --details results/details-rpc.json
      - uses: actions/upload-artifact@v4
        with:
          name: txconform-rpc-results
          path: |
            results/rpc.jsonl
            results/REPORT-rpc.md
            results/details-rpc.json
            validator.log
