name: conformance
on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: catch SDK releases that regress
jobs:
  oracle-and-harnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: Build oracle (Agave crates)
        run: cargo build --release --manifest-path oracle/Cargo.toml
      - name: Generate + judge vectors
        run: |
          mkdir -p vectors results
          ./oracle/target/release/txconform-oracle gen --out vectors/vectors.jsonl --random 200
          ./oracle/target/release/txconform-oracle judge --vectors vectors/vectors.jsonl --out vectors/oracle.jsonl
      - name: TypeScript harnesses (kit, web3.js 3.x, web3.js 1.x)
        working-directory: harness/ts
        run: |
          npm ci
          node harness_kit.js ../../vectors/vectors.jsonl ../../results/kit.jsonl
          node harness_web3.js ../../vectors/vectors.jsonl ../../results/web3js3.jsonl
          node harness_web3.js ../../vectors/vectors.jsonl ../../results/web3js1.jsonl web3js1
      - name: Python harness (solders)
        run: |
          pip install -r harness/py/requirements.txt
          python harness/py/harness_solders.py vectors/vectors.jsonl results/solders.jsonl
      - name: Go harness (solana-go v2)
        working-directory: harness/go
        run: |
          go build -o harness-go .
          ./harness-go ../../vectors/vectors.jsonl ../../results/solana-go.jsonl
      - name: Report
        run: |
          python3 tools/rust_sdk_results.py vectors/oracle.jsonl results/rust-sdk.jsonl oracle/Cargo.lock
          python3 txconform.py --results results/rust-sdk.jsonl results/kit.jsonl results/web3js3.jsonl results/web3js1.jsonl results/solders.jsonl results/solana-go.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: txconform-results
          path: |
            vectors/
            results/
      - name: Gate on known-good baseline
        run: python3 tools/check_baseline.py results/details.json baseline.json
