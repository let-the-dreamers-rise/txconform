[package]
name = "txconform-oracle"
version = "0.1.0"
edition = "2021"
description = "Spec-derived Solana transaction wire-format vectors judged by Agave's own parser"
license = "Apache-2.0"

[dependencies]
agave-transaction-view = "9.0.0"
solana-runtime-transaction = { version = "4.5.0-alpha.4", features = ["agave-unstable-api"] }
solana-transaction = { version = "6.0", features = ["serde", "blake3", "wincode"] }
solana-message = { version = "6.0", features = ["serde", "blake3", "wincode"] }
solana-pubkey = "4"
solana-hash = "4"
wincode = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bs58 = "0.5"
rand = "0.8"
rand_chacha = "0.3"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 2
